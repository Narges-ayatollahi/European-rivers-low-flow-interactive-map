    { "type": "Feature", "geometry": { "type": "Point", "coordinates": [22.5, 49.3] }, "properties": { "River": "San", "Country": "Poland", "Location": "Bieszczady", "Severity": "High", "Date": "2026-07-12", "EFAS Jun-2026 Flow Category (Copernicus C3S)": "Lowest recorded for month", "Description": "Upper San river reaches hit historic low flow levels.", "Image URL": "", "Article URL": "https://www.nowiny24.pl" } },
    { "type": "Feature", "geometry": { "type": "Point", "coordinates": [-6.98, 42.41] }, "properties": { "River": "Sil", "Country": "Spain", "Location": "O Barco de Valdeorras", "Severity": "High", "Date": "2026-07-19", "EFAS Jun-2026 Flow Category (Copernicus C3S)": "Much lower than average", "Description": "Hydropower output suspended along Sil river reach due to depleted reservoir inflows.", "Image URL": "", "Article URL": "https://www.farodevigo.es" } },
    { "type": "Feature", "geometry": { "type": "Point", "coordinates": [-0.22, 38.54] }, "properties": { "River": "Serpis / Reservoirs", "Country": "Spain", "Location": "Marina Baja", "Severity": "High", "Date": "2026-07-25", "EFAS Jun-2026 Flow Category (Copernicus C3S)": "Lowest recorded for month", "Description": "Critical water emergency declared across Alicante reservoir network.", "Image URL": "", "Article URL": "https://www.informacion.es" } },
    { "type": "Feature", "geometry": { "type": "Point", "coordinates": [18.05, 46.91] }, "properties": { "River": "Lake Balaton", "Country": "Hungary", "Location": "Siófok", "Severity": "Medium", "Date": "2026-07-30", "EFAS Jun-2026 Flow Category (Copernicus C3S)": "Lower than average", "Description": "High summer evaporation rates cause lake water level to drop below optimal seasonal average.", "Image URL": "", "Article URL": "https://www.hungarytoday.hu" } }
  ]
};

// 2. Initialize Leaflet Map over Europe
const map = L.map('map').setView([48.5, 10], 5);

// 3. BASE MAP — single Esri layer only (World Terrain Base, the layer Esri
//    itself recommends pairing with the Hydro Reference Overlay below)
const esriBase = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}',
    {
        maxZoom: 13, // this Esri service tops out around z13; overlay below goes further
        attribution: 'Basemap &copy; Esri &mdash; Esri, USGS, NOAA'
    }
).addTo(map);

// 4. RIVER NAMES LAYER — real Esri Hydro Reference Overlay (labeled rivers,
//    lakes, drainage network; names sourced from geonames.org). Transparent
//    background, designed to sit on top of a plain base map like the one above.
const hydroOverlay = L.tileLayer(
    'https://tiles.arcgis.com/tiles/P3ePLMYs2RVChkJx/arcgis/rest/services/Esri_Hydro_Reference_Overlay/MapServer/tile/{z}/{y}/{x}',
    {
        maxZoom: 16,
        opacity: 0.95,
        attribution: 'Hydro Reference Overlay &copy; Esri'
    }
).addTo(map);

// Layer Control Box — just the one toggle now (river-name overlay on/off)
L.control.layers(
    null,
    { "River names (Esri Hydro Reference Overlay)": hydroOverlay },
    { collapsed: false }
).addTo(map);

// 5. COLOR MAPPER BY SEVERITY
function getMarkerColor(props) {
    const sev = (props.Severity || '').toLowerCase().trim();
    const efas = (props['EFAS Jun-2026 Flow Category (Copernicus C3S)'] || '').toLowerCase().trim();

    if (sev === 'high' || efas.includes('lowest')) return '#991b1b';  // Dark Crimson
    if (efas.includes('much lower') || sev === 'severe') return '#ef4444'; // Bright Red
    if (sev === 'medium' || efas.includes('lower')) return '#f97316';     // Orange
    return '#eab308'; // Yellow
}

// 6. RENDER MARKERS FROM EMBEDDED GEODATA
const markerLayer = L.geoJSON(riverData, {
    pointToLayer: function(feature, latlng) {
        const props = feature.properties || {};
        const color = getMarkerColor(props);

        return L.circleMarker(latlng, {
            radius: 9,
            fillColor: color,
            color: '#ffffff',
            weight: 2,
            opacity: 1,
            fillOpacity: 0.92
        });
    },
    onEachFeature: function(feature, layer) {
        const props = feature.properties || {};
        let popupHtml = '';

        // A. Image Preview Box
        const imgUrl = props['Image URL'];
        if (imgUrl && typeof imgUrl === 'string' && imgUrl.startsWith('http')) {
            popupHtml += `
            <div class="popup-img-container">
                <img src="${imgUrl}" class="popup-img" alt="River Location Photo" 
                     referrerpolicy="no-referrer" loading="lazy" 
                     onerror="this.parentElement.style.display='none';">
            </div>`;
        }

        // B. Badges
        popupHtml += `<div class="badge-group">`;
        if (props.Severity) {
            const color = getMarkerColor(props);
            popupHtml += `<span class="popup-badge" style="background-color:${color};">Severity: ${props.Severity}</span>`;
        }
        if (props['EFAS Jun-2026 Flow Category (Copernicus C3S)']) {
            popupHtml += `<span class="popup-badge" style="background-color:#475569;">${props['EFAS Jun-2026 Flow Category (Copernicus C3S)']}</span>`;
        }
        popupHtml += `</div>`;

        // C. Title & Details
        const river = props.River || 'River Event';
        const country = props.Country ? ` (${props.Country})` : '';
        popupHtml += `<div class="popup-title">${river}${country}</div>`;

        if (props.Location) popupHtml += `<div class="popup-detail"><b>Location:</b> ${props.Location}</div>`;
        if (props.Date) popupHtml += `<div class="popup-date"><b>Date:</b> ${props.Date}</div>`;
        if (props.Description) popupHtml += `<div class="popup-detail" style="margin-top:6px;">${props.Description}</div>`;

        // D. External Link
        if (props['Article URL'] && props['Article URL'].startsWith('http')) {
            popupHtml += `<a href="${props['Article URL']}" target="_blank" class="popup-link">🔗 Read Source Article &rarr;</a>`;
        }

        layer.bindPopup(popupHtml);
    }
}).addTo(map);

// Auto-fit zoom bounds
if (markerLayer.getBounds().isValid()) {
    map.fitBounds(markerLayer.getBounds().pad(0.08));
}

// 7. MAP LEGEND
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML = '<b>Low-Flow Severity</b>' +
        '<div><i style="background: #991b1b"></i> High / Lowest Flow</div>' +
        '<div><i style="background: #ef4444"></i> Much Lower than Avg</div>' +
        '<div><i style="background: #f97316"></i> Medium / Lower</div>' +
        '<div><i style="background: #eab308"></i> Near Average</div>';
    return div;
};
legend.addTo(map);

</script>
